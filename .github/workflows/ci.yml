name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...


  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build


  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build backend image
        run: |
          docker build \
            -t $IMAGE_PREFIX/pastebin-backend:${GITHUB_SHA} \
            -t $IMAGE_PREFIX/pastebin-backend:latest \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t $IMAGE_PREFIX/pastebin-frontend:${GITHUB_SHA} \
            -t $IMAGE_PREFIX/pastebin-frontend:latest \
            ./frontend

      - name: Push backend image
        run: |
          docker push $IMAGE_PREFIX/pastebin-backend:${GITHUB_SHA}
          docker push $IMAGE_PREFIX/pastebin-backend:latest

      - name: Push frontend image
        run: |
          docker push $IMAGE_PREFIX/pastebin-frontend:${GITHUB_SHA}
          docker push $IMAGE_PREFIX/pastebin-frontend:latest